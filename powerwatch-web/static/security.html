<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PowerWatch · Security</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--good:#3fb950;--bad:#f85149}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:ui-monospace,"Cascadia Code","Fira Code",monospace}a{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{font-size:1.1rem;margin:0}h2{font-size:1rem;margin:0 0 12px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:var(--muted);font-size:.78rem;margin:8px 0 5px}input,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:7px 9px}input{width:100%}button{cursor:pointer}button:hover,button.primary{border-color:var(--good)}button.danger{color:var(--bad);border-color:var(--bad)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.help,.status{color:var(--muted);font-size:.78rem;line-height:1.5}.status{min-height:20px;margin-top:10px;white-space:pre-wrap}.status.error{color:var(--bad)}.status.good{color:var(--good)}.token-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}.token-row:first-child{border-top:0}.token-meta{color:var(--muted);font-size:.74rem;margin-top:3px}.revealed{margin-top:12px;padding:10px;border:1px solid var(--good);border-radius:4px;word-break:break-all;color:var(--good)}@media(max-width:700px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><h1 id="title">PowerWatch · Security</h1><a href="/" id="back">Back to dashboard</a></div>
<div id="disabled" class="panel" hidden></div>
<main id="content" hidden>
  <div class="panel"><h2 id="account-title">Administrator account</h2><div id="account-info" class="help"></div>
    <div class="grid"><div><label id="current-label" for="current-password">Current password</label><input id="current-password" type="password" autocomplete="current-password"></div><div><label id="new-label" for="new-password">New password (12 characters minimum)</label><input id="new-password" type="password" autocomplete="new-password" minlength="12"></div></div>
    <div class="actions"><button class="primary" id="change-password">Change password</button><button class="danger" id="revoke-sessions">Revoke all sessions</button></div><div id="account-status" class="status"></div>
  </div>
  <div class="panel"><h2 id="tokens-title">Integration API tokens</h2><p id="tokens-help" class="help"></p>
    <div class="grid"><div><label id="token-name-label" for="token-name">Token name</label><input id="token-name" maxlength="80" placeholder="PowerWatch Hub"></div><div style="display:flex;align-items:end"><button class="primary" id="create-token">Create read-only token</button></div></div>
    <div id="revealed-token"></div><div id="tokens" style="margin-top:12px"></div><div id="token-status" class="status"></div>
  </div>
</main>
<script src="/static/i18n.js"></script>
<script src="/static/auth.js"></script>
<script>
const lang=localStorage.getItem("powerwatch-language")==="fr"?"fr":"en";
const m={fr:{title:"PowerWatch · Sécurité",back:"Retour au dashboard",disabled:"L’authentification intégrée est désactivée. Activez POWERWATCH_AUTH_ENABLED dans la configuration Docker puis redémarrez PowerWatch.",account:"Compte administrateur",current:"Mot de passe actuel",next:"Nouveau mot de passe (12 caractères minimum)",change:"Changer le mot de passe",revokeSessions:"Révoquer toutes les sessions",sessions:n=>`${n} session(s) active(s)`,tokens:"Jetons API d’intégration",help:"Jetons Bearer en lecture seule pour PowerWatch Hub et Dockge-Enhanced. La valeur complète n’est affichée qu’une fois.",name:"Nom du jeton",create:"Créer un jeton en lecture seule",created:"Copiez ce jeton maintenant : il ne sera plus affiché.",revoke:"Révoquer",changed:"Mot de passe modifié. Reconnexion nécessaire.",revoked:"Sessions révoquées. Reconnexion nécessaire.",failed:"Échec",never:"jamais utilisé",last:"dernière utilisation"},en:{title:"PowerWatch · Security",back:"Back to dashboard",disabled:"Integrated authentication is disabled. Enable POWERWATCH_AUTH_ENABLED in the Docker configuration, then restart PowerWatch.",account:"Administrator account",current:"Current password",next:"New password (12 characters minimum)",change:"Change password",revokeSessions:"Revoke all sessions",sessions:n=>`${n} active session(s)`,tokens:"Integration API tokens",help:"Read-only Bearer tokens for PowerWatch Hub and Dockge-Enhanced. The full value is shown only once.",name:"Token name",create:"Create read-only token",created:"Copy this token now: it will not be shown again.",revoke:"Revoke",changed:"Password changed. Sign in again.",revoked:"Sessions revoked. Sign in again.",failed:"Failed",never:"never used",last:"last used"}}[lang];
function labels(){document.getElementById("title").textContent=m.title;document.getElementById("back").textContent=m.back;document.getElementById("disabled").textContent=m.disabled;document.getElementById("account-title").textContent=m.account;document.getElementById("current-label").textContent=m.current;document.getElementById("new-label").textContent=m.next;document.getElementById("change-password").textContent=m.change;document.getElementById("revoke-sessions").textContent=m.revokeSessions;document.getElementById("tokens-title").textContent=m.tokens;document.getElementById("tokens-help").textContent=m.help;document.getElementById("token-name-label").textContent=m.name;document.getElementById("create-token").textContent=m.create}labels();
function errorText(raw){try{return JSON.parse(raw).error||raw}catch(_){return raw}}
async function load(){await PowerWatchAuth.ready;if(!PowerWatchAuth.enabled){document.getElementById("disabled").hidden=false;return}document.getElementById("content").hidden=false;const r=await fetch("/api/auth/settings");if(!r.ok)return;render(await r.json())}
function render(data){document.getElementById("account-info").textContent=`${data.username} · ${m.sessions(data.active_sessions)}`;const list=document.getElementById("tokens");list.innerHTML="";(data.api_tokens||[]).forEach(token=>{const row=document.createElement("div");row.className="token-row";const info=document.createElement("div");const name=document.createElement("div");name.textContent=token.name;const meta=document.createElement("div");meta.className="token-meta";meta.textContent=`${token.scope} · ${m.last}: ${token.last_used_at?new Date(token.last_used_at*1000).toLocaleString():m.never}`;info.append(name,meta);const button=document.createElement("button");button.className="danger";button.textContent=m.revoke;button.onclick=()=>revokeToken(token.id);row.append(info,button);list.append(row)})}
async function revokeToken(id){const r=await fetch(`/api/auth/tokens/${encodeURIComponent(id)}`,{method:"DELETE"});if(!r.ok){document.getElementById("token-status").textContent=`${m.failed}: ${errorText(await r.text())}`;return}await refresh()}
async function refresh(){const r=await fetch("/api/auth/settings");if(r.ok)render(await r.json())}
document.getElementById("create-token").onclick=async()=>{const name=document.getElementById("token-name").value.trim();const r=await fetch("/api/auth/tokens",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});if(!r.ok){document.getElementById("token-status").textContent=`${m.failed}: ${errorText(await r.text())}`;return}const d=await r.json();const shown=document.getElementById("revealed-token");shown.className="revealed";shown.textContent=`${m.created}\n${d.token}`;document.getElementById("token-name").value="";await refresh()};
document.getElementById("change-password").onclick=async()=>{const r=await fetch("/api/auth/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password:document.getElementById("current-password").value,new_password:document.getElementById("new-password").value})});const status=document.getElementById("account-status");if(!r.ok){status.className="status error";status.textContent=`${m.failed}: ${errorText(await r.text())}`;return}status.className="status good";status.textContent=m.changed;setTimeout(()=>location.assign("/"),900)};
document.getElementById("revoke-sessions").onclick=async()=>{const r=await fetch("/api/auth/sessions/revoke",{method:"POST"});if(r.ok){document.getElementById("account-status").textContent=m.revoked;setTimeout(()=>location.assign("/"),900)}};load();
</script>
</body>
</html>
