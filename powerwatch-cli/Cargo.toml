[package]
name = "powerwatch-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "powerwatch"
path = "src/main.rs"

[dependencies]
powerwatch-core = { path = "../powerwatch-core" }
clap = { version = "=4.5.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
