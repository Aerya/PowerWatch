services:
  powerwatch:
    image: ghcr.io/aerya/powerwatch:latest
    container_name: powerwatch
    hostname: powerwatch
    restart: unless-stopped

    pid: host

    # ---------------------------------------------------------------------
    # INTEL RAPL VIA MSR - OPTIONAL / OPTIONNEL
    # ---------------------------------------------------------------------
    # FR : certains noyaux, notamment Synology DSM sur Gemini Lake, exposent
    # /dev/cpu/0/msr mais pas /sys/.../powercap. Le pilote Linux msr exige
    # CAP_SYS_RAWIO même si le processus du conteneur tourne en root.
    # Si ce device existe sur l'hôte, décommentez les DEUX BLOCS ci-dessous.
    # Inutile d'utiliser privileged: true.
    #
    # EN: some kernels, notably Synology DSM on Gemini Lake, expose
    # /dev/cpu/0/msr but not /sys/.../powercap. The Linux msr driver requires
    # CAP_SYS_RAWIO even when the container process runs as root.
    # If this device exists on the host, uncomment BOTH blocks below.
    # There is no need to use privileged: true.
    #
    # cap_add:
    #   - SYS_RAWIO
    #
    # devices:
    #   - /dev/cpu/0/msr:/dev/cpu/0/msr:r

    ports:
      - "${POWERWATCH_BIND_IP:-127.0.0.1}:3000:3000"

    # FR : /sys expose les capteurs matériels généraux de l'hôte
    # (GPU AMD/Intel hwmon, disques, etc.).
    # Le second montage expose directement /sys/devices/virtual sous un
    # chemin dédié afin que RAPL reste visible dans Docker même lorsque
    # le simple bind /sys ne rend pas powercap accessible au conteneur.
    #
    # EN: /sys exposes general host hardware sensors
    # (AMD/Intel GPU hwmon, disks, etc.).
    # The second mount exposes /sys/devices/virtual at a dedicated path so
    # RAPL remains visible in Docker even when the plain /sys bind does not
    # expose the powercap subtree inside the container.
    volumes:
      - /sys:/sys:ro
      - /sys/devices/virtual:/host-sys-virtual:ro
      - ./data:/data/.local/share/powerwatch

    environment:
      # FR : chemin RAPL dédié. Si powercap n'est pas disponible,
      # PowerWatch tente automatiquement le fallback /dev/cpu/0/msr lorsque
      # le device ET CAP_SYS_RAWIO ont été exposés via les blocs ci-dessus.
      # EN: dedicated RAPL path. If powercap is unavailable, PowerWatch
      # automatically tries /dev/cpu/0/msr when both the device and
      # CAP_SYS_RAWIO have been exposed through the blocks above.
      POWERWATCH_POWERCAP_PATH: /host-sys-virtual/powercap/intel-rapl

      # ---------------------------------------------------------------------
      # NVIDIA GPU(S) - OPTIONAL / OPTIONNEL
      # ---------------------------------------------------------------------
      # FR :
      # Si l'hôte possède un ou plusieurs GPU NVIDIA :
      # 1. installer le pilote NVIDIA ;
      # 2. installer NVIDIA Container Toolkit ;
      # 3. décommenter les DEUX lignes ci-dessous ;
      # 4. décommenter également le bloc "deploy" plus bas.
      #
      # AMD + NVIDIA ? Intel + NVIDIA ? Plusieurs GPU ?
      # Aucun problème : AMD/Intel restent détectés via /sys et tous les GPU
      # NVIDIA exposés par le runtime sont ajoutés séparément.
      #
      # EN:
      # If the host has one or more NVIDIA GPUs:
      # 1. install the NVIDIA driver;
      # 2. install NVIDIA Container Toolkit;
      # 3. uncomment BOTH lines below;
      # 4. also uncomment the "deploy" block below.
      #
      # AMD + NVIDIA? Intel + NVIDIA? Multiple GPUs?
      # No problem: AMD/Intel remain detected through /sys and every NVIDIA
      # GPU exposed by the runtime is added separately.
      #
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: utility

    # FR : pour NVIDIA, décommentez CE BLOC COMPLET.
    # EN: for NVIDIA, uncomment THIS WHOLE BLOCK.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true
